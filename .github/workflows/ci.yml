name: Qualidade do Impostor
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  codigo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm test:ui
      - run: pnpm words:integrity
      - run: pnpm export:check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
  conteudo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-words.mjs
